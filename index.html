<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Campañas y Posts</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Librería para leer archivos Excel (.xlsx / .xls) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <header class="main-header">
    <h1>Panel de Rendimiento de Campañas</h1>
    <div class="file-upload-wrapper">
      <label for="excel-file" class="btn-primary">📁 Cargar Archivo Excel</label>
      <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" />
    </div>
  </header>

  <main class="container">
    <!-- Vista Principal: Grid de Campañas -->
    <section id="campaigns-view" class="view">
      <h2>Campañas Activas</h2>
      <div id="campaigns-grid" class="grid-container">
        <!-- Se genera dinámicamente -->
      </div>
    </section>

    <!-- Vista Detallada: Posts de una Campaña -->
    <section id="posts-view" class="view hidden">
      <div class="posts-header">
        <button id="btn-back" class="btn-secondary">← Volver a Campañas</button>
        <h2 id="campaign-detail-title">Posts de la Campaña</h2>
      </div>
      <div id="posts-grid" class="grid-container">
        <!-- Se genera dinámicamente al dar clic en una campaña -->
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Redes Sociales R.A</title>
  <style>
    :root {
      --primary-color: #1a73e8;
      --bg-color: #f4f7fe;
      --card-bg: #ffffff;
      --text-main: #2b3674;
      --text-muted: #a3edd0;
      --border-color: #e9ecef;
      --shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
    }

    * {
      box-sizing: border-box;
      font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 30px;
    }

    header {
      margin-bottom: 25px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 20px 0;
    }

    /* Pestañas de Navegación */
    .tabs-wrapper {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 25px;
    }

    .tab-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 30px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      color: #707ebe;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.03);
    }

    .tab-btn:hover {
      background: #e8f0fe;
      color: var(--primary-color);
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
      box-shadow: 0px 6px 16px rgba(26, 115, 232, 0.3);
    }

    /* Sección de Tarjetas KPI */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .kpi-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .kpi-title {
      font-size: 13px;
      color: #8f9bba;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Contenedor de Tabla */
    .table-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      overflow-x: auto;
    }

    .table-header-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #f8f9fa;
      color: #8f9bba;
      font-size: 12px;
      text-transform: uppercase;
      padding: 14px 16px;
      border-bottom: 2px solid var(--border-color);
    }

    td {
      padding: 14px 16px;
      font-size: 14px;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
    }

    tr:hover {
      background-color: #fcfdfe;
    }

    #loading {
      text-align: center;
      padding: 40px;
      font-weight: 500;
      color: #707ebe;
    }
  </style>
</head>
<body>

  <header>
    <h1>Dashboard Redes Sociales R.A</h1>
    <div id="tabs-container" class="tabs-wrapper"></div>
  </header>

  <main id="main-content">
    <div id="loading">Cargando datos desde Google Sheets...</div>

    <div id="dashboard-body" style="display: none;">
      <!-- Tarjetas Resumen -->
      <div id="kpi-container" class="kpi-grid"></div>

      <!-- Tabla Principal -->
      <div class="table-card">
        <div class="table-header-title" id="current-tab-title">Detalle de Datos</div>
        <table id="data-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-pcDIxBq4H7gNOnf7-YNQcKSe3Zb8m_w6FooiY2OPfBSdrnlg5KZL-fvYzeJaaEgb/exec";

    let excelData = {};
    let currentSheet = "";

    async function fetchData() {
      try {
        const response = await fetch(SCRIPT_URL);
        excelData = await response.json();
        
        const sheets = Object.keys(excelData);
        if (sheets.length === 0) return;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard-body').style.display = 'block';

        renderTabs(sheets);
        switchSheet(sheets[0]);
      } catch (err) {
        document.getElementById('loading').innerText = "Error al conectar con la hoja de datos.";
        console.error(err);
      }
    }

    function renderTabs(sheets) {
      const container = document.getElementById('tabs-container');
      container.innerHTML = "";

      sheets.forEach(name => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${name === currentSheet ? 'active' : ''}`;
        btn.innerText = name;
        btn.onclick = () => switchSheet(name);
        container.appendChild(btn);
      });
    }

    function switchSheet(sheetName) {
      currentSheet = sheetName;
      document.getElementById('current-tab-title').innerText = sheetName;

      // Actualizar estado de pestañas
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === sheetName);
      });

      const rows = excelData[sheetName];
      if (!rows || rows.length === 0) return;

      renderKPIs(rows);
      renderTable(rows);
    }

    function renderKPIs(rows) {
      const kpiContainer = document.getElementById('kpi-container');
      kpiContainer.innerHTML = "";

      if (rows.length < 2) return;

      const headers = rows[0];
      const lastRow = rows[rows.length - 1]; // Tomar la última fila con registros para métricas actuales

      // Mostramos las primeras 4-5 columnas numéricas/clave como tarjetas KPI
      headers.slice(2, 7).forEach((header, idx) => {
        const colIndex = idx + 2;
        const card = document.createElement('div');
        card.className = 'kpi-card';
        card.innerHTML = `
          <div class="kpi-title">${header}</div>
          <div class="kpi-value">${lastRow[colIndex] || 'N/A'}</div>
        `;
        kpiContainer.appendChild(card);
      });
    }

    function renderTable(rows) {
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');

      thead.innerHTML = "";
      tbody.innerHTML = "";

      const headers = rows[0];

      // Cabecera
      const trHead = document.createElement('tr');
      headers.forEach(h => {
        const th = document.createElement('th');
        th.innerText = h || "";
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);

      // Filas
      for (let i = 1; i < rows.length; i++) {
        const tr = document.createElement('tr');
        headers.forEach((_, colIdx) => {
          const td = document.createElement('td');
          td.innerText = rows[i][colIdx] !== undefined ? rows[i][colIdx] : "";
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
    }

    window.addEventListener('DOMContentLoaded', fetchData);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Marketing - Lectura Dinámica</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-dark: #030712;
      --card-glass: rgba(15, 23, 42, 0.7);
      --border-glass: rgba(0, 242, 254, 0.25);
      --cyan-glow: #00F2FE;
      --text-main: #F8FAFC;
      --sidebar-width: 260px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar { width: var(--sidebar-width); background: #020617; border-right: 1px solid rgba(255,255,255,0.1); padding: 20px; }
    .menu-item { padding: 12px; margin-bottom: 8px; color: #94A3B8; cursor: pointer; border-radius: 8px; font-weight: 600; }
    .menu-item:hover, .menu-item.active { background: rgba(0, 242, 254, 0.1); color: #FFF; border-left: 3px solid var(--cyan-glow); }

    /* MAIN */
    .main-content { flex-grow: 1; padding: 25px; width: calc(100% - var(--sidebar-width)); }

    /* TOPBAR */
    .topbar { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; }
    .select-date { background: #0F172A; color: #FFF; border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 6px; }

    /* TABS Y TABLAS DINÁMICAS */
    .subtabs-bar { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .subtab-btn { background: #0F172A; border: 1px solid rgba(255,255,255,0.1); color: #94A3B8; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
    .subtab-btn.active { background: var(--cyan-glow); color: #000; font-weight: 700; }

    .table-container { overflow-x: auto; background: var(--card-glass); border: 1px solid var(--border-glass); border-radius: 12px; padding: 15px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
    .data-table th, .data-table td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .data-table th { color: var(--cyan-glow); text-transform: uppercase; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <h3 style="color:#FFF; margin-bottom:20px;">Dashboard</h3>
    <div class="menu-item active" onclick="switchSection('excel-data')">
      <i class="fa-solid fa-table"></i> Pestañas del Excel
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div id="status-label" style="color:var(--cyan-glow); font-size:0.9rem;">Cargando Excel automático...</div>
      <header class="topbar">
  <div id="status-label" class="status-badge">
    <i class="fa-solid fa-spinner fa-spin"></i> Conectando a Google Sheets...
  </div>
  
  <!-- 🟢 PEGAR AQUÍ EL INTERRUPTOR -->
  <div class="brand-switch-container">
    <span class="brand-label" id="label-acq" style="color:var(--cyan-glow);">Acquaroni</span>
    <label class="switch">
      <input type="checkbox" id="brandToggle" onchange="toggleBrand()">
      <span class="slider"></span>
    </label>
    <span class="brand-label" id="label-aztec">AZtec Oils</span>
  </div>

  <!-- Controles de Período / Fecha -->
  <div style="display:flex; gap:10px;">
      <!-- Selector de Fecha -->
      <div style="display:flex; gap:10px;">
        <select id="selectMonth" class="select-date" onchange="renderActiveSheet()">
          <option value="ALL">Todos los Meses</option>
          <option value="0">Enero</option>
          <option value="1">Febrero</option>
          <option value="2">Marzo</option>
          <option value="3">Abril</option>
          <option value="4">Mayo</option>
          <option value="5">Junio</option>
          <option value="6">Julio</option>
          <option value="7">Agosto</option>
          <option value="8">Septiembre</option>
          <option value="9">Octubre</option>
          <option value="10">Noviembre</option>
          <option value="11">Diciembre</option>
        </select>

        <select id="selectYear" class="select-date" onchange="renderActiveSheet()">
          <option value="ALL">Todos los Años</option>
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026" selected>2026</option>
        </select>
      </div>
    </header>

    <!-- Área donde se renderizan las pestañas del Excel -->
    <section id="excel-data">
      <div class="subtabs-bar" id="sheet-subtabs"></div>
      <div class="table-container">
        <table class="data-table">
          <thead id="dynamic-table-head"></thead>
          <tbody id="dynamic-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // Objeto donde guardaremos los datos parsed del Excel
    let excelSheetsData = {};
    let activeSheetName = '';

    // Carga automática del archivo al iniciar la página
    window.addEventListener('DOMContentLoaded', () => {
      loadExcelAutomatically();
    });

    async function loadExcelAutomatically() {
      const statusLabel = document.getElementById('status-label');
      try {
        // Busca el archivo datos.xlsx guardado en el mismo directorio
        const response = await fetch('datos.xlsx');
        if (!response.ok) throw new Error("No se encontró el archivo datos.xlsx");
        
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });

        excelSheetsData = {};

        // Extrae TODAS las pestañas y TODAS sus filas/columnas
        workbook.SheetNames.forEach(sheetName => {
          const sheet = workbook.Sheets[sheetName];
          // Convertimos la pestaña en un arreglo de objetos JSON
          excelSheetsData[sheetName] = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        });

        statusLabel.innerText = "Excel cargado exitosamente";
        
        // Seleccionamos la primera pestaña por defecto
        if (workbook.SheetNames.length > 0) {
          activeSheetName = workbook.SheetNames[0];
          buildSheetTabs(workbook.SheetNames);
          renderActiveSheet();
        }

      } catch (err) {
        statusLabel.innerText = "Error o archivo datos.xlsx no encontrado. (Revisa la consola)";
        console.error(err);
      }
    }

    // Genera un botón dinámico para cada pestaña detectada en el Excel
    function buildSheetTabs(sheetNames) {
      const subtabsContainer = document.getElementById('sheet-subtabs');
      subtabsContainer.innerHTML = sheetNames.map(name => `
        <button class="subtab-btn ${name === activeSheetName ? 'active' : ''}" onclick="selectSheet('${name}')">
          ${name}
        </button>
      `).join('');
    }

    function selectSheet(name) {
      activeSheetName = name;
      document.querySelectorAll('.subtab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.trim() === name);
      });
      renderActiveSheet();
    }

    // Renderiza dinámicamente las columnas y filas de la pestaña activa con filtro de fecha
    function renderActiveSheet() {
      const rows = excelSheetsData[activeSheetName] || [];
      const thead = document.getElementById('dynamic-table-head');
      const tbody = document.getElementById('dynamic-table-body');

      if (rows.length === 0) {
        thead.innerHTML = '';
        tbody.innerHTML = `<tr><td style="color:#64748B;">La pestaña "${activeSheetName}" no contiene datos.</td></tr>`;
        return;
      }

      // 1. Obtener dinámicamente los nombres de TODAS las columnas del Excel
      const columns = Object.keys(rows[0]);

      // Generar la cabecera dinámica de la tabla
      thead.innerHTML = `<tr>${columns.map(col => `<th>${col}</th>`).join('')}</tr>`;

      // 2. Filtrar por fecha si existe alguna columna de fecha
      const filteredRows = filterRowsByDate(rows, columns);

      if (filteredRows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${columns.length}" style="text-align:center; color:#64748B;">No hay datos para el período seleccionado.</td></tr>`;
        return;
      }

      // 3. Generar las filas dinámicamente leyendo el valor de cada columna
      tbody.innerHTML = filteredRows.map(row => `
        <tr>
          ${columns.map(col => {
            let val = row[col];
            // Formatear si es una fecha JS
            if (val instanceof Date) {
              val = val.toISOString().split('T')[0];
            }
            return `<td>${val !== undefined ? val : ''}</td>`;
          }).join('')}
        </tr>
      `).join('');
    }

    // Filtra las filas si detecta una columna cuyo nombre contenga 'fecha' o 'date'
    function filterRowsByDate(rows, columns) {
      const selMonth = document.getElementById('selectMonth').value;
      const selYear = document.getElementById('selectYear').value;

      if (selMonth === 'ALL' && selYear === 'ALL') return rows;

      // Buscar si alguna columna de la pestaña es de tipo fecha
      const dateCol = columns.find(c => c.toLowerCase().includes('fecha') || c.toLowerCase().includes('date'));
      if (!dateCol) return rows; // Si no hay columna de fecha, muestra todos los datos

      return rows.filter(row => {
        let rawDate = row[dateCol];
        if (!rawDate) return true;

        let d = new Date(rawDate);
        if (isNaN(d.getTime())) return true;

        let matchMonth = (selMonth === 'ALL') || (d.getMonth() === parseInt(selMonth));
        let matchYear = (selYear === 'ALL') || (d.getFullYear() === parseInt(selYear));

        return matchMonth && matchYear;
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Redes Sociales R.A</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #080d26;
      --card-bg: #111c44;
      --card-inner: #1b254b;
      --accent: #7551ff;
      --accent-glow: rgba(117, 81, 255, 0.35);
      --text-main: #ffffff;
      --text-gray: #a3edd0;
      --text-muted: #8f9bba;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0px 18px 40px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 30px;
      min-height: 100vh;
    }

    /* Header & Controles Superiores */
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .filters-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      padding: 10px 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-group label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    .filter-group select {
      background: var(--card-inner);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Módulos Principales */
    .modules-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
      overflow-x: auto;
    }

    .module-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 700;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .module-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.04);
    }

    .module-btn.active {
      color: #ffffff;
      background: var(--accent);
      box-shadow: 0px 4px 15px var(--accent-glow);
    }

    /* Pestañas de Plataformas (FB, IG, TikTok, etc.) */
    .tabs-wrapper {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 25px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    .tab-btn.active {
      background: var(--card-inner);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0px 0px 12px var(--accent-glow);
    }

    /* Dashboard Widgets Grid (Basado en el diseño de Pinterest) */
    .dashboard-widgets {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .widget-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      min-height: 120px;
    }

    .widget-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--accent);
      opacity: 0.8;
    }

    .widget-header {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .widget-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .widget-subtext {
      font-size: 12px;
      color: var(--text-gray);
      font-weight: 600;
    }

    /* Bloque de Perfil Demográfico (Edad y Género) */
    .demographics-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .demo-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .demo-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .demo-badge {
      display: inline-block;
      background: var(--card-inner);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      border: 1px solid var(--border);
    }

    #empty-state {
      text-align: center;
      padding: 60px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
    }

    #loading {
      text-align: center;
      padding: 60px;
      font-size: 16px;
      color: var(--text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Encabezado y Filtros Globales -->
  <header class="header-container">
    <h1>Dashboard Redes Sociales R.A</h1>

    <div class="filters-bar">
      <!-- Filtro de Cuenta -->
      <div class="filter-group">
        <label for="account-select">Cuenta:</label>
        <select id="account-select" onchange="applyFilters()">
          <option value="ALL">Todas las cuentas</option>
          <option value="Acquaroni">Repuestos Acquaroni</option>
          <option value="AZtec">AZtec Oils</option>
        </select>
      </div>

      <!-- Filtro de Año -->
      <div class="filter-group">
        <label for="year-select">Año:</label>
        <select id="year-select" onchange="applyFilters()">
          <option value="ALL">Todos los Años</option>
        </select>
      </div>

      <!-- Filtro de Mes -->
      <div class="filter-group">
        <label for="month-select">Mes:</label>
        <select id="month-select" onchange="applyFilters()">
          <option value="ALL">Todos los Meses</option>
          <option value="Enero">Enero</option>
          <option value="Febrero">Febrero</option>
          <option value="Marzo">Marzo</option>
          <option value="Abril">Abril</option>
          <option value="Mayo">Mayo</option>
          <option value="Junio">Junio</option>
          <option value="Julio">Julio</option>
          <option value="Agosto">Agosto</option>
          <option value="Septiembre">Septiembre</option>
          <option value="Octubre">Octubre</option>
          <option value="Noviembre">Noviembre</option>
          <option value="Diciembre">Diciembre</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Navegación de Módulos Principales -->
  <nav class="modules-nav">
    <button class="module-btn active" onclick="switchModule('redes')">Redes Sociales</button>
    <button class="module-btn" onclick="switchModule('impulsados')">Post Impulsados</button>
    <button class="module-btn" onclick="switchModule('campanas')">Campañas</button>
    <button class="module-btn" onclick="switchModule('presupuesto')">Presupuesto</button>
    <button class="module-btn" onclick="switchModule('plataformas')">Plataformas</button>
  </nav>

  <!-- Sub-pestañas de Plataformas -->
  <div id="tabs-container" class="tabs-wrapper"></div>

  <!-- Vista Dashboard -->
  <main id="main-content">
    <div id="loading">Cargando datos desde Google Sheets...</div>

    <div id="dashboard-body" style="display: none;">
      
      <!-- Contenedor de Widgets KPIs estilizados -->
      <div id="widgets-container" class="dashboard-widgets"></div>

      <!-- Contenedor Demográfico (Edad y Género) -->
      <div id="demographics-container" class="demographics-container" style="display: none;">
        <div class="demo-card">
          <div class="demo-title">Rango de Edad Principal</div>
          <div id="age-value" class="demo-badge">N/A</div>
        </div>
        <div class="demo-card">
          <div class="demo-title">Género Predominante</div>
          <div id="gender-value" class="demo-badge">N/A</div>
        </div>
      </div>

      <div id="empty-state" style="display: none;">
        No hay datos registrados para los filtros seleccionados.
      </div>

    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-pcDIxBq4H7gNOnf7-YNQcKSe3Zb8m_w6FooiY2OPfBSdrnlg5KZL-fvYzeJaaEgb/exec";

    let rawData = {};
    let currentModule = "redes";
    let selectedAccount = "ALL";
    let selectedYear = "ALL";
    let selectedMonth = "ALL";
    let activeSheet = "";

    async function init() {
      try {
        const response = await fetch(SCRIPT_URL);
        rawData = await response.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard-body').style.display = 'block';

        populateYearFilter();
        renderModule();
      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerText = "Error al conectar con la base de datos de Google Sheets.";
      }
    }

    // Llenar el dropdown de Años automáticamente analizando la data
    function populateYearFilter() {
      const yearSelect = document.getElementById('year-select');
      const years = new Set();

      Object.values(rawData).forEach(sheetRows => {
        if (sheetRows.length > 1) {
          const headers = sheetRows[0];
          const yearColIdx = headers.findIndex(h => String(h).toUpperCase().includes('AÑO') || String(h).toUpperCase().includes('ANO'));
          if (yearColIdx !== -1) {
            for (let i = 1; i < sheetRows.length; i++) {
              const val = sheetRows[i][yearColIdx];
              if (val) years.add(String(val));
            }
          }
        }
      });

      years.forEach(y => {
        const opt = document.createElement('option');
        opt.value = y;
        opt.innerText = y;
        yearSelect.appendChild(opt);
      });
    }

    function applyFilters() {
      selectedAccount = document.getElementById('account-select').value;
      selectedYear = document.getElementById('year-select').value;
      selectedMonth = document.getElementById('month-select').value;
      renderModule();
    }

    function switchModule(moduleName) {
      currentModule = moduleName;
      document.querySelectorAll('.module-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(moduleName));
      });
      renderModule();
    }

    function renderModule() {
      const allSheets = Object.keys(rawData);
      let filteredSheets = allSheets;

      if (currentModule === 'redes') {
        filteredSheets = allSheets.filter(s => 
          !s.toLowerCase().includes('impulsados') && 
          !s.toLowerCase().includes('campaña') && 
          !s.toLowerCase().includes('presupuesto') && 
          !s.toLowerCase().includes('plataforma')
        );
      } else if (currentModule === 'impulsados') {
        filteredSheets = allSheets.filter(s => s.toLowerCase().includes('impulsados'));
      } else if (currentModule === 'campanas') {
        filteredSheets = allSheets.filter(s => s.toLowerCase().includes('campaña') || s.toLowerCase().includes('campanas'));
      } else if (currentModule === 'presupuesto') {
        filteredSheets = allSheets.filter(s => s.toLowerCase().includes('presupuesto'));
      } else if (currentModule === 'plataformas') {
        filteredSheets = allSheets.filter(s => s.toLowerCase().includes('plataforma'));
      }

      if (selectedAccount !== "ALL") {
        filteredSheets = filteredSheets.filter(s => s.toLowerCase().includes(selectedAccount.toLowerCase()));
      }

      renderTabs(filteredSheets);
    }

    function renderTabs(sheets) {
      const container = document.getElementById('tabs-container');
      container.innerHTML = "";

      if (sheets.length === 0) {
        document.getElementById('widgets-container').innerHTML = "";
        document.getElementById('demographics-container').style.display = 'none';
        document.getElementById('empty-state').style.display = 'block';
        return;
      }

      document.getElementById('empty-state').style.display = 'none';

      sheets.forEach((name, index) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
        btn.innerText = name;
        btn.onclick = () => switchSheet(name);
        container.appendChild(btn);
      });

      switchSheet(sheets[0]);
    }

    function switchSheet(sheetName) {
      activeSheet = sheetName;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === sheetName);
      });

      const rows = rawData[sheetName];
      if (!rows || rows.length === 0) return;

      renderFilteredData(rows);
    }

    function renderFilteredData(rows) {
      const headers = rows[0];
      const dataRows = rows.slice(1);

      const yearIdx = headers.findIndex(h => String(h).toUpperCase().includes('AÑO') || String(h).toUpperCase().includes('ANO'));
      const monthIdx = headers.findIndex(h => String(h).toUpperCase().includes('MES'));

      // Filtrar filas por Año y Mes si aplican
      const filtered = dataRows.filter(row => {
        let matchYear = true;
        let matchMonth = true;

        if (selectedYear !== "ALL" && yearIdx !== -1) {
          matchYear = String(row[yearIdx]) === String(selectedYear);
        }
        if (selectedMonth !== "ALL" && monthIdx !== -1) {
          matchMonth = String(row[monthIdx]).toLowerCase().includes(selectedMonth.toLowerCase());
        }

        return matchYear && matchMonth;
      });

      if (filtered.length === 0) {
        document.getElementById('widgets-container').innerHTML = "";
        document.getElementById('demographics-container').style.display = 'none';
        document.getElementById('empty-state').style.display = 'block';
      } else {
        document.getElementById('empty-state').style.display = 'none';
        renderWidgets(headers, filtered);
      }
    }

    function renderWidgets(headers, filteredRows) {
      const container = document.getElementById('widgets-container');
      container.innerHTML = "";

      const demoContainer = document.getElementById('demographics-container');
      demoContainer.style.display = 'none';

      let ageVal = 'N/A';
      let genderVal = 'N/A';

      headers.forEach((h, colIdx) => {
        const headerUpper = String(h).toUpperCase().trim();

        // Omitir columnas de filtrado de la grilla de métricas
        if (headerUpper.includes('AÑO') || headerUpper.includes('ANO') || headerUpper.includes('MES') || headerUpper.includes('CUENTA')) {
          return;
        }

        if (headerUpper.includes('EDAD')) {
          ageVal = filteredRows[filteredRows.length - 1][colIdx] || 'N/A';
          return;
        }

        if (headerUpper.includes('GÉNERO') || headerUpper.includes('GENERO')) {
          genderVal = filteredRows[filteredRows.length - 1][colIdx] || 'N/A';
          return;
        }

        // Mostrar cada columna del Excel como una tarjeta KPI estilizada
        const latestVal = filteredRows[filteredRows.length - 1][colIdx] || "0";

        const card = document.createElement('div');
        card.className = 'widget-card';
        card.innerHTML = `
          <div class="widget-header">${h}</div>
          <div class="widget-value">${latestVal}</div>
          <div class="widget-subtext">Valor en el período</div>
        `;
        container.appendChild(card);
      });

      // Mostrar demografía si existe
      if (ageVal !== 'N/A' || genderVal !== 'N/A') {
        demoContainer.style.display = 'grid';
        document.getElementById('age-value').innerText = ageVal;
        document.getElementById('gender-value').innerText = genderVal;
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Intelligence Dashboard</title>
  
  <!-- Tailwind CSS CDN para estilos rápidos y responsivos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js para visualización de métricas y gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PapaParse para procesamiento eficiente de archivos CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen">

  <!-- Header / Control Panel -->
  <header class="bg-slate-900 text-white p-6 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Marketing Intelligence Dashboard</h1>
        <p class="text-slate-400 text-sm">Panel de Control de Métricas Social Media</p>
      </div>
      <div class="flex items-center gap-3">
        <button id="refreshBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition-all text-sm flex items-center gap-2">
          <span>Actualizar Datos</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto p-6 space-y-6">

    <!-- Overview Cards -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <!-- Card 1: Alcance Total -->
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Alcance Total</p>
        <p id="totalReach" class="text-3xl font-extrabold text-slate-800 mt-2">--</p>
        <span class="text-xs text-emerald-600 font-medium">Live Data</span>
      </div>

      <!-- Card 2: Impresiones -->
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Impresiones</p>
        <p id="totalImpressions" class="text-3xl font-extrabold text-slate-800 mt-2">--</p>
        <span class="text-xs text-emerald-600 font-medium">Live Data</span>
      </div>

      <!-- Card 3: Crecimiento Seguidores -->
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Nuevos Seguidores</p>
        <p id="totalFollowers" class="text-3xl font-extrabold text-slate-800 mt-2">--</p>
        <span class="text-xs text-blue-600 font-medium">Mensual</span>
      </div>

      <!-- Card 4: Retención / Engagement -->
      <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Engagement Rate</p>
        <p id="engagementRate" class="text-3xl font-extrabold text-slate-800 mt-2">--%</p>
        <span class="text-xs text-blue-600 font-medium">Promedio</span>
      </div>
    </section>

    <!-- Charts Section -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Chart 1 -->
      <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <h3 class="text-lg font-bold text-slate-800 mb-4">Rendimiento por Plataforma</h3>
        <div class="relative h-64">
          <canvas id="platformChart"></canvas>
        </div>
      </div>

      <!-- Chart 2 -->
      <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <h3 class="text-lg font-bold text-slate-800 mb-4">Tendencia Mensual de Alcance</h3>
        <div class="relative h-64">
          <canvas id="trendChart"></canvas>
        </div>
      </div>
    </section>

  </main>

  <!-- Script Principal -->
  <script>
    // URL de tu Google Sheet publicado como CSV
    const CSV_URL = 'TU_URL_DE_GOOGLE_SHEETS_AQUI';

    async function loadDashboardData() {
      if (!CSV_URL || CSV_URL === 'TU_URL_DE_GOOGLE_SHEETS_AQUI') {
        console.warn('Reemplaza CSV_URL con tu enlace de Google Sheets publicado.');
        return;
      }

      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        complete: function(results) {
          console.log("Datos cargados correctamente:", results.data);
          // Aquí agregas la lógica para procesar las métricas
        },
        error: function(err) {
          console.error("Error cargando el archivo CSV:", err);
        }
      });
    }

    document.getElementById('refreshBtn').addEventListener('click', loadDashboardData);
    window.addEventListener('DOMContentLoaded', loadDashboardData);
  </script>
</body>
</html>

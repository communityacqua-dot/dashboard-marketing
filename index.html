<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Redes Sociales R.A</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b1437;
      --card-bg: #111c44;
      --accent: #7551ff;
      --accent-hover: #5d3eff;
      --text-main: #ffffff;
      --text-gray: #8f9bba;
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 30px;
      min-height: 100vh;
    }

    /* Encabezado y Navegación Principal */
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .account-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .account-selector label {
      font-size: 13px;
      color: var(--text-gray);
      font-weight: 600;
    }

    .account-selector select {
      background: #1b254b;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Navegación por Módulos / Secciones */
    .modules-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
      overflow-x: auto;
    }

    .module-btn {
      background: transparent;
      border: none;
      color: var(--text-gray);
      font-size: 15px;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .module-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .module-btn.active {
      color: #ffffff;
      background: var(--accent);
    }

    /* Sub-pestañas de Plataformas (FB, IG, TikTok, etc.) */
    .tabs-wrapper {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 25px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-gray);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0px 4px 12px rgba(117, 81, 255, 0.4);
    }

    /* Tarjetas KPI */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .kpi-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .kpi-title {
      font-size: 12px;
      color: var(--text-gray);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Tablas */
    .table-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow-x: auto;
    }

    .table-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #1b254b;
      color: var(--text-gray);
      font-size: 12px;
      text-transform: uppercase;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 16px;
      font-size: 14px;
      color: var(--text-main);
      border-bottom: 1px solid var(--border);
    }

    tr:hover td {
      background-color: rgba(255, 255, 255, 0.03);
    }

    /* Galería de Campañas / Post Impulsados */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .campaign-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .campaign-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #1b254b;
    }

    .campaign-body {
      padding: 16px;
    }

    .campaign-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .campaign-meta {
      font-size: 13px;
      color: var(--text-gray);
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    #loading {
      text-align: center;
      padding: 50px;
      font-size: 16px;
      color: var(--text-gray);
    }
  </style>
</head>
<body>

  <!-- Encabezado y Selector de Cuentas -->
  <header class="header-container">
    <h1>Dashboard Redes Sociales R.A</h1>
    <div class="account-selector">
      <label for="account-select">Cuenta:</label>
      <select id="account-select" onchange="onAccountChange()">
        <option value="ALL">Todas las cuentas</option>
        <option value="Acquaroni">Repuestos Acquaroni</option>
        <option value="AZtec">AZtec Oils</option>
      </select>
    </div>
  </header>

  <!-- Navegación por Secciones Principales -->
  <nav class="modules-nav">
    <button class="module-btn active" onclick="switchModule('redes')">Redes Sociales</button>
    <button class="module-btn" onclick="switchModule('impulsados')">Post Impulsados</button>
    <button class="module-btn" onclick="switchModule('campanas')">Campañas</button>
    <button class="module-btn" onclick="switchModule('presupuesto')">Presupuesto</button>
    <button class="module-btn" onclick="switchModule('plataformas')">Plataformas</button>
  </nav>

  <!-- Pestañas Específicas (Plataformas) -->
  <div id="tabs-container" class="tabs-wrapper"></div>

  <!-- Contenido Principal -->
  <main id="main-content">
    <div id="loading">Cargando datos desde Google Sheets...</div>

    <div id="dashboard-body" style="display: none;">
      <!-- Métricas Resumen (KPIs) -->
      <div id="kpi-container" class="kpi-grid"></div>

      <!-- Vista Tabla -->
      <div id="table-view" class="table-card">
        <div class="table-title" id="current-tab-title">Detalle de Registros</div>
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <!-- Vista Galería (para Campañas / Impulsados) -->
      <div id="gallery-view" class="gallery-grid" style="display: none;"></div>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-pcDIxBq4H7gNOnf7-YNQcKSe3Zb8m_w6FooiY2OPfBSdrnlg5KZL-fvYzeJaaEgb/exec";

    let rawData = {};
    let currentModule = "redes";
    let selectedAccount = "ALL";
    let activeSheet = "";

    async function init() {
      try {
        const response = await fetch(SCRIPT_URL);
        rawData = await response.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard-body').style.display = 'block';

        renderModule();
      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerText = "Error al conectar con la base de datos de Google Sheets.";
      }
    }

    function onAccountChange() {
      selectedAccount = document.getElementById('account-select').value;
      renderModule();
    }

    function switchModule(moduleName) {
      currentModule = moduleName;
      document.querySelectorAll('.module-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(moduleName));
      });
      renderModule();
    }

    function renderModule() {
      const allSheets = Object.keys(rawData);
      let filteredSheets = allSheets;

      // Filtrar pestañas por el módulo activo
      if (currentModule === 'redes') {
        filteredSheets = allSheets.filter(s => 
          !s.toLowerCase().includes('impulsados') && 
          !s.toLowerCase().includes('campaña') && 
          !s.toLowerCase().includes('presupuesto') && 
          !s.toLowerCase().includes('plataforma')
        );
      } else if (currentModule === 'impulsados') {
        filteredSheets = allSheets.filter(s => s.toLowerCase().includes('impulsados'));
      } else if (currentModule === 'campanas') {
        filteredSheets = allSheets.filter(s => s.toLowerCase().includes('campaña') || s.toLowerCase().includes('campanas'));
      } else if (currentModule === 'presupuesto') {
        filteredSheets = allSheets.filter(s => s.toLowerCase().includes('presupuesto'));
      } else if (currentModule === 'plataformas') {
        filteredSheets = allSheets.filter(s => s.toLowerCase().includes('plataforma'));
      }

      // Filtrar por cuenta (Acquaroni vs AZtec)
      if (selectedAccount !== "ALL") {
        filteredSheets = filteredSheets.filter(s => s.toLowerCase().includes(selectedAccount.toLowerCase()));
      }

      renderTabs(filteredSheets);
    }

    function renderTabs(sheets) {
      const container = document.getElementById('tabs-container');
      container.innerHTML = "";

      if (sheets.length === 0) {
        document.getElementById('current-tab-title').innerText = "No se encontraron pestañas para este filtro.";
        document.getElementById('table-head').innerHTML = "";
        document.getElementById('table-body').innerHTML = "";
        document.getElementById('kpi-container').innerHTML = "";
        return;
      }

      sheets.forEach((name, index) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
        btn.innerText = name;
        btn.onclick = () => switchSheet(name);
        container.appendChild(btn);
      });

      switchSheet(sheets[0]);
    }

    function switchSheet(sheetName) {
      activeSheet = sheetName;
      document.getElementById('current-tab-title').innerText = sheetName;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === sheetName);
      });

      const rows = rawData[sheetName];
      if (!rows || rows.length === 0) return;

      renderKPIs(rows);
      
      if (currentModule === 'campanas' || currentModule === 'impulsados') {
        // Opción de vista tarjetas si contienen imágenes o resumen visual
        renderTable(rows); 
      } else {
        renderTable(rows);
      }
    }

    function renderKPIs(rows) {
      const kpiContainer = document.getElementById('kpi-container');
      kpiContainer.innerHTML = "";

      if (rows.length < 2) return;

      const headers = rows[0];
      const latestRow = rows[rows.length - 1]; // Toma los datos del último registro para métricas acumuladas

      headers.slice(2, 7).forEach((header, idx) => {
        const colIdx = idx + 2;
        const val = latestRow[colIdx] !== undefined ? latestRow[colIdx] : "N/A";

        const card = document.createElement('div');
        card.className = 'kpi-card';
        card.innerHTML = `
          <div class="kpi-title">${header}</div>
          <div class="kpi-value">${val}</div>
        `;
        kpiContainer.appendChild(card);
      });
    }

    function renderTable(rows) {
      document.getElementById('table-view').style.display = 'block';
      document.getElementById('gallery-view').style.display = 'none';

      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');

      thead.innerHTML = "";
      tbody.innerHTML = "";

      const headers = rows[0];

      // Cabecera de la Tabla
      const trHead = document.createElement('tr');
      headers.forEach(h => {
        const th = document.createElement('th');
        th.innerText = h || "";
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);

      // Filas con la información del Excel
      for (let i = 1; i < rows.length; i++) {
        const tr = document.createElement('tr');
        headers.forEach((_, colIdx) => {
          const td = document.createElement('td');
          const cellVal = rows[i][colIdx] !== undefined ? rows[i][colIdx] : "";
          td.innerText = cellVal;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
